<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="refresh" content="0; url=./">
<title>Redirecting to the map</title>
<link rel="canonical" href="./">
<script>
  // The viewer moved to the site root when the map became the homepage.
  // Preserve any ?m= / ?b= / #view state so old links keep working.
  location.replace('./' + location.search + location.hash);
</script>
</head>
<body>
<p>The map is now at <a href="./">the homepage</a>.</p>
</body>
</html>
