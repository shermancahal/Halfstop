name: Publish to GitHub Pages

# The one thing that publishes https://shermancahal.github.io/Map/
#
# "The one thing" is load-bearing. There used to be a second workflow that also
# deployed to Pages, uploading the repository root instead of ./dist. Both ran
# on every push, both went green, and the second finished about thirteen
# seconds after the first — so it silently overwrote every good deploy with a
# build that had no token.js (gitignored, so never in the repo), no
# deployed.txt, and no cache-busted filenames. The symptom was a 404 on two
# files nobody could explain, on a site that otherwise worked.
#
# The `confirm` job at the bottom exists so that cannot happen again quietly:
# it reads the live site after publishing and fails if what is served is not
# what this run built.

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
  workflow_dispatch:
    inputs:
      bbox:
        description: >-
          Cut a Protomaps archive for this bounding box and publish it with the
          site: minlon,minlat,maxlon,maxlat. Overrides the PROTOMAPS_BBOX
          variable for this run, so a coverage can be tried before it is
          committed to. Ignored when PROTOMAPS_ARCHIVE names a bucket.
        required: false
        type: string
      maxzoom:
        description: 'How deep to cut it. Each level is four times the one below; 13 shows every road this map draws.'
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

# Pages allows one deployment at a time. Queue rather than cancel, so a run is
# never discarded halfway through publishing.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  verify:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests
        run: npm test

      - name: Verify data/catalog.json matches data/maps/
        run: npm run check

      - name: Validate the map style
        # Mapbox GL aborts style loading on any spec error and renders nothing,
        # having already reported success — a blank map with a clean console is
        # what one bad property looks like. Worth the install.
        run: |
          npm install --no-save @mapbox/mapbox-gl-style-spec
          npm run validate:style

      - name: Smoke test
        # Drives the real app against a stubbed map engine. This is the only
        # check that sees the class of bug the unit tests structurally cannot:
        # the app talking to a map over time — basemap switches dropping saved
        # pins, layers rejected at addLayer, state that does not survive a
        # reload.
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          npm run smoke

  build:
    name: Build
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ---------------------------------------------------------------- archive
      #
      # Cutting the map archive here, into the site itself.
      #
      # Byways Topo can draw from a Protomaps archive instead of from Mapbox -
      # free to look at, and downloadable - and the only thing it needs is a
      # URL. Standing up a bucket to get one is a reasonable amount of work to
      # do before finding out whether you like the map, so this offers the
      # short way round: set PROTOMAPS_BBOX and the archive is cut here and
      # published alongside the site, with no bucket, no credentials and no
      # bill.
      #
      # Pages turns out to serve it correctly - it answers Range requests with
      # a 206 and sends Access-Control-Allow-Origin, both measured rather than
      # assumed (tools/layer-candidates.json, the pages: probes). The limit is
      # the 1 GB published site, not the 100 MB *git* file limit, because this
      # file never goes anywhere near git.
      #
      # PROTOMAPS_ARCHIVE still wins where it is set. A real bucket is the
      # answer for a wide region; this is the answer for finding out.
      - name: Plan the map archive
        id: plan
        env:
          BBOX: ${{ inputs.bbox || vars.PROTOMAPS_BBOX }}
          MAXZOOM: ${{ inputs.maxzoom || vars.PROTOMAPS_MAXZOOM }}
          CONFIGURED: ${{ vars.PROTOMAPS_ARCHIVE }}
          REBUILD: ${{ vars.PROTOMAPS_REBUILD }}
        run: |
          set -euo pipefail
          # A configured URL wins, and no bbox means nothing to cut.
          if [ -n "$CONFIGURED" ] || [ -z "$BBOX" ]; then
            echo "wanted=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ZOOM="${MAXZOOM:-13}"
          {
            echo "wanted=yes"
            echo "bbox=$BBOX"
            echo "zoom=$ZOOM"
            # A cache key may not contain a comma, and a bounding box is four
            # numbers separated by commas. That is not a detail: the first run
            # of this failed on it, and because a failed step fails its job,
            # it took the entire site deploy down with it.
            echo "key=pmtiles-$(printf '%s' "$BBOX" | tr ',' '_')-${ZOOM}-${REBUILD:-1}"
          } >> "$GITHUB_OUTPUT"

      - name: Cache the map archive
        id: archive-cache
        if: ${{ steps.plan.outputs.wanted != '' }}
        # Never fatal. This whole path is a convenience, and the site is the
        # product: publishing without the archive is a worse map, while not
        # publishing is no map at all.
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: tiles/byways.pmtiles
          # Deliberately not keyed on the date. Re-cutting a continental
          # extract on every deploy would add ten minutes to each one for a
          # basemap that changes meaningfully over months. Bump
          # PROTOMAPS_REBUILD to force a fresh cut.
          key: ${{ steps.plan.outputs.key }}

      - name: Cut the map archive
        id: archive
        if: ${{ steps.plan.outputs.wanted != '' }}
        # Same reasoning as the cache step: a bad bbox, or Protomaps having an
        # afternoon, must not stop the site from going out. The step after this
        # says so out loud rather than leaving a skipped archive to be noticed
        # from the map looking wrong.
        continue-on-error: true
        env:
          BBOX: ${{ steps.plan.outputs.bbox }}
          ZOOM: ${{ steps.plan.outputs.zoom }}
          PLANET: ${{ vars.PROTOMAPS_PLANET_URL }}
          CACHED: ${{ steps.archive-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail

          if [ "$CACHED" = "true" ] && [ -s tiles/byways.pmtiles ]; then
            echo "Reusing the cached extract."
          else
            mkdir -p tiles

            # The release asset is found by asking which assets exist, not by
            # composing a filename. Their naming carries the version, so
            # /latest/download/<name> cannot be written down in advance, and a
            # guessed name fails as a 404 that reads like the tool being gone.
            ASSET=$(curl -fsSL https://api.github.com/repos/protomaps/go-pmtiles/releases/latest \
              | jq -r '.assets[] | select(.name | test("[Ll]inux_x86_64\\.tar\\.gz$")) | .browser_download_url' \
              | head -1)
            if [ -z "$ASSET" ]; then
              echo "::error::No Linux x86_64 asset in the latest go-pmtiles release. Assets available:"
              curl -fsSL https://api.github.com/repos/protomaps/go-pmtiles/releases/latest | jq -r '.assets[].name'
              exit 1
            fi
            echo "pmtiles: $ASSET"
            curl -fsSL "$ASSET" | tar xz pmtiles

            # Which daily planet build to cut from, discovered rather than
            # guessed: today's may not have finished, and the last date I could
            # have written into this file is already wrong.
            if [ -z "$PLANET" ]; then
              for back in $(seq 0 14); do
                DAY=$(date -u -d "-${back} day" +%Y%m%d)
                TRY="https://build.protomaps.com/${DAY}.pmtiles"
                if curl -fsI --max-time 30 "$TRY" >/dev/null 2>&1; then PLANET="$TRY"; break; fi
              done
            fi
            if [ -z "$PLANET" ]; then
              echo "::error::No daily build answered under https://build.protomaps.com/ for the last 15 days."
              echo "::error::Set the PROTOMAPS_PLANET_URL variable to the archive to cut from."
              exit 1
            fi
            echo "planet: $PLANET"

            # Reads the planet by byte range rather than downloading it, which
            # is the same property that makes the result usable in a browser.
            ./pmtiles extract "$PLANET" tiles/byways.pmtiles --bbox="$BBOX" --maxzoom="$ZOOM"
          fi

          BYTES=$(stat -c%s tiles/byways.pmtiles)
          echo "archive: $((BYTES / 1024 / 1024)) MB"
          if [ "$BYTES" -gt 800000000 ]; then
            echo "::error::The extract is $((BYTES / 1024 / 1024)) MB. A published Pages site is capped at 1 GB,"
            echo "::error::and the rest of the site needs room. Narrow PROTOMAPS_BBOX or lower PROTOMAPS_MAXZOOM,"
            echo "::error::or host it on a bucket and set PROTOMAPS_ARCHIVE to its URL instead."
            exit 1
          fi

          # The depth the file actually has, not the one that was asked for.
          # Overstating it draws blank ground past the archive's real limit,
          # and an extract can come back shallower than requested.
          DEPTH=$(./pmtiles show tiles/byways.pmtiles 2>/dev/null | grep -oiE 'max[ _]?zoom:? *[0-9]+' | grep -oE '[0-9]+' | head -1 || true)
          echo "url=./tiles/byways.pmtiles" >> "$GITHUB_OUTPUT"
          echo "maxzoom=${DEPTH:-$ZOOM}" >> "$GITHUB_OUTPUT"
          {
            echo "### Map archive"
            echo "- Cut from \`$PLANET\`"
            echo "- \`$BBOX\` to zoom ${DEPTH:-$ZOOM} — $((BYTES / 1024 / 1024)) MB, published at \`tiles/byways.pmtiles\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Say so if the archive was wanted and did not arrive
        if: ${{ steps.plan.outputs.wanted != '' && steps.archive.outputs.url == '' }}
        run: |
          echo "::warning::A map archive was requested for ${{ steps.plan.outputs.bbox }} and could not be cut."
          echo "::warning::The site is publishing without it, so Byways Topo will draw from Mapbox."
          {
            echo "### Map archive"
            echo "- **Requested and not produced.** \`${{ steps.plan.outputs.bbox }}\` to zoom ${{ steps.plan.outputs.zoom }}."
            echo "- The site was published anyway; Byways Topo falls back to Mapbox."
            echo "- The reason is in the *Cut the map archive* step above."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write the client config
        # Pages replaces the whole site each time, so there is nothing on the
        # far end to preserve and the file is always written — even empty, so
        # the script tag that loads it does not 404. The app runs without a
        # token, on MapLibre and the raster basemaps.
        env:
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # Not a secret - a public URL on a public bucket - but a repository
          # variable rather than a literal, because it differs between the site
          # and the app bundle and should be changeable without a commit.
          #
          # An archive cut above wins only where no URL was configured: a
          # bucket is somebody's deliberate choice and must not be silently
          # replaced by a test extract.
          PROTOMAPS_ARCHIVE: ${{ vars.PROTOMAPS_ARCHIVE || steps.archive.outputs.url }}
          # The depth read back from the file when one was cut, since an
          # extract can come back shallower than it was asked for.
          PROTOMAPS_MAXZOOM: ${{ steps.archive.outputs.maxzoom || vars.PROTOMAPS_MAXZOOM }}
        run: |
          {
            printf "window.ABMAP_MAPBOX_TOKEN = '%s';\n" "$MAPBOX_TOKEN"
            printf "window.ABMAP_SUPABASE_URL = '%s';\n" "$SUPABASE_URL"
            printf "window.ABMAP_SUPABASE_KEY = '%s';\n" "$SUPABASE_KEY"
            printf "window.ABMAP_PROTOMAPS_ARCHIVE = '%s';\n" "$PROTOMAPS_ARCHIVE"
            printf "window.ABMAP_PROTOMAPS_MAXZOOM = '%s';\n" "$PROTOMAPS_MAXZOOM"
          } > assets/js/token.js

          # Every value, every time. Reporting the URL's length but not the
          # key's is how "where is the login button" became unanswerable from
          # the logs: accounts need both, and only one was ever printed.
          echo "mapbox=${#MAPBOX_TOKEN} supabase_url=${#SUPABASE_URL} supabase_key=${#SUPABASE_KEY} protomaps=${#PROTOMAPS_ARCHIVE}"
          {
            echo "### Client config"
            if [ -n "$MAPBOX_TOKEN" ]; then
              echo "- Mapbox token present (${#MAPBOX_TOKEN} chars) — vector basemaps and route shields will render."
            else
              echo "- **No MAPBOX_TOKEN secret.** Byways Topo cannot render and falls back to CyclOSM raster:"
              echo "  different colours, no route shields. Set it under Settings → Secrets and variables → Actions."
            fi
            if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_KEY" ]; then
              echo "- Supabase configured (url ${#SUPABASE_URL}, key ${#SUPABASE_KEY} chars) — the account menu is shown."
            else
              echo "- **Accounts are off**: SUPABASE_URL is ${#SUPABASE_URL} chars and SUPABASE_KEY is ${#SUPABASE_KEY}."
              echo "  Both are required, and the sign-in control stays hidden until they are set."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage the upload package
        run: npm run build && node tools/build-dist.mjs

      - name: Put the archive in the site
        if: ${{ steps.archive.outputs.url != '' }}
        # After the build, deliberately. build-dist writes the service
        # worker's precache list from what is in dist at that moment, and a
        # several-hundred-megabyte precache entry would try to download the
        # whole archive the first time anyone opened the site. The worker
        # ignores .pmtiles entirely; this keeps it out of the list as well.
        run: |
          mkdir -p dist/tiles
          cp tiles/byways.pmtiles dist/tiles/byways.pmtiles
          ls -lh dist/tiles/

      - name: Stamp the build
        run: |
          {
            echo "commit: $GITHUB_SHA"
            echo "branch: $GITHUB_REF_NAME"
            echo "run:    $GITHUB_RUN_NUMBER"
            echo "built:  $(date -u '+%Y-%m-%d %H:%M:%SZ')"
            echo "host:   github-pages"
          } > dist/deployed.txt
          cat dist/deployed.txt

      - name: Disable Jekyll
        # Without this, Pages runs the artifact through Jekyll, which silently
        # drops files and directories whose names begin with an underscore.
        run: touch dist/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Publish
    needs: build
    # A pull request gets the tests and the build, not the site.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  confirm:
    name: Confirm what is live
    needs: deploy
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Read the live site back
        env:
          PAGE_URL: ${{ needs.deploy.outputs.url }}
          HAS_TOKEN: ${{ secrets.MAPBOX_TOKEN != '' }}
        run: |
          set -euo pipefail
          echo "Checking $PAGE_URL"

          # Pages can take a few seconds to serve a new deployment.
          stamp=""
          for attempt in 1 2 3 4 5 6; do
            if stamp=$(curl -fsS --max-time 20 "${PAGE_URL}deployed.txt" 2>/dev/null); then break; fi
            echo "  deployed.txt not there yet (attempt $attempt); waiting"
            sleep 10
            stamp=""
          done

          if [ -z "$stamp" ]; then
            echo "::error::deployed.txt is not being served. Something other than this workflow is publishing to Pages."
            exit 1
          fi

          echo "$stamp"
          if ! grep -q "$GITHUB_SHA" <<<"$stamp"; then
            echo "::error::The live build stamp is not this commit. Another workflow is deploying over this one."
            grep '^commit:' <<<"$stamp"
            echo "expected: $GITHUB_SHA"
            exit 1
          fi

          # token.js must exist. Whether it has a token in it depends on the
          # secret, and the two failures are different: a 404 means the wrong
          # thing was published, an empty value means the secret is unset.
          config=$(curl -fsS --max-time 20 "${PAGE_URL}assets/js/token.js") || {
            echo "::error::assets/js/token.js is not being served — the published artifact is not the built site."
            exit 1
          }

          if [ "$HAS_TOKEN" = "true" ] && grep -q "ABMAP_MAPBOX_TOKEN = ''" <<<"$config"; then
            echo "::error::MAPBOX_TOKEN is set as a secret but did not reach the published site."
            exit 1
          fi

          {
            echo "### Live at $PAGE_URL"
            echo '```'
            echo "$stamp"
            echo '```'
            if [ "$HAS_TOKEN" = "true" ]; then
              echo "Mapbox token is being served."
            else
              echo "No Mapbox token — running on the open raster basemaps."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
