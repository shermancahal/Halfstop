name: Publish to GitHub Pages

# A second, independent home for the built site, at
# https://shermancahal.github.io/Map/
#
# This exists because the FTP deploy depends on the host's document root being
# what you think it is, and when it is not, the failure is invisible: the upload
# succeeds, the log is green, and the site does not change. Pages has no
# equivalent failure mode — GitHub serves exactly the artifact this workflow
# builds, or the run fails and says so.
#
# It publishes ./dist, the same package the FTP deploy sends, so the two hosts
# never drift. Nothing outside dist/ is published: no README, no tests, no
# tooling.
#
# One-time setup: Settings -> Pages -> Source -> "GitHub Actions".

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages allows one deployment at a time. Queue rather than cancel, so a run is
# never discarded halfway through publishing.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: npm test

      - name: Verify data/catalog.json matches data/maps/
        run: npm run check

      - name: Write the client config
        # Unlike the FTP deploy, this cannot blank a token already on a server:
        # Pages replaces the whole site each time, so there is nothing to
        # preserve. The file is always written, even when empty, so the script
        # tag that loads it does not 404 — the app runs without a token, on
        # MapLibre and the raster basemaps.
        env:
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          {
            printf "window.ABMAP_MAPBOX_TOKEN = '%s';\n" "$MAPBOX_TOKEN"
            printf "window.ABMAP_SUPABASE_URL = '%s';\n" "$SUPABASE_URL"
            printf "window.ABMAP_SUPABASE_KEY = '%s';\n" "$SUPABASE_KEY"
          } > assets/js/token.js
          echo "Client config written: mapbox=${#MAPBOX_TOKEN} chars, supabase=${#SUPABASE_URL} chars"

      - name: Stage the upload package
        run: npm run build && node tools/build-dist.mjs

      - name: Stamp the build
        run: |
          {
            echo "commit: $GITHUB_SHA"
            echo "branch: $GITHUB_REF_NAME"
            echo "run:    $GITHUB_RUN_NUMBER"
            echo "built:  $(date -u '+%Y-%m-%d %H:%M:%SZ')"
            echo "host:   github-pages"
          } > dist/deployed.txt
          cat dist/deployed.txt

      - name: Disable Jekyll
        # Without this, Pages runs the artifact through Jekyll, which silently
        # drops files and directories whose names begin with an underscore.
        run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
