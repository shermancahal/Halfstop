name: Build and deploy

on:
  push:
    branches:
      - main
      # Pre-merge preview: publishes the working branch to the same Pages site,
      # so the deployed build can be checked before merging. Drop this line once
      # the branch is merged and main should be the only thing that deploys.
      - 'claude/**'
  pull_request:
  workflow_dispatch:

# Allow one deployment at a time; skip queued runs rather than piling up.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Test and verify catalogue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run tests
        run: npm test
      - name: Verify data/catalog.json matches data/maps/
        run: npm run check

  deploy:
    name: Deploy to GitHub Pages
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # The site is static — no bundling step, the repository is the artifact.
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
