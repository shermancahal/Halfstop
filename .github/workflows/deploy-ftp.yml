name: Deploy to web host (FTP)

# Publishes the built site to shared hosting on every push to the working
# branch, so the browser is the only place you need to look after a change.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   FTP_SERVER    e.g. ftp.shermanc8.sg-host.com
#   FTP_USERNAME  the FTP account user
#   FTP_PASSWORD  the FTP account password
#   FTP_DIR       target directory, e.g. /public_html/  (must end in a slash)
#
# Optional secret, so the deployed site gets a Mapbox token without the token
# ever being committed:
#   MAPBOX_TOKEN  pk.…
#
# Nothing runs if the secrets are absent, so forks and clones stay inert.

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:
    inputs:
      clean_slate:
        description: >-
          Delete everything in the target directory first, then upload the whole
          site. Use when the server contents are wrong, or when the sync-state
          file no longer matches what is actually there. Check FTP_DIR before
          running this: it deletes whatever that directory holds.
        type: boolean
        default: false

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: npm test

      - name: Verify data/catalog.json matches data/maps/
        run: npm run check

      - name: Write the Mapbox token
        # token.js is gitignored, so it is generated here from the secret.
        #
        # When the secret is absent we must NOT ship an empty token.js: doing so
        # would overwrite a token already on the server and silently drop the
        # Mapbox basemaps. Instead the file is excluded from the upload, leaving
        # whatever is already deployed untouched.
        id: token
        env:
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -n "$MAPBOX_TOKEN" ] || [ -n "$SUPABASE_URL" ]; then
            {
              printf "window.ABMAP_MAPBOX_TOKEN = '%s';\n" "$MAPBOX_TOKEN"
              printf "window.ABMAP_SUPABASE_URL = '%s';\n" "$SUPABASE_URL"
              printf "window.ABMAP_SUPABASE_KEY = '%s';\n" "$SUPABASE_KEY"
            } > assets/js/token.js
            echo "Client config written: mapbox=${#MAPBOX_TOKEN} chars, supabase=${#SUPABASE_URL} chars"
            echo "skip=" >> "$GITHUB_OUTPUT"
          else
            echo "No MAPBOX_TOKEN or SUPABASE_URL secret set."
            echo "Leaving any token.js already on the server alone, rather than blanking it."
            echo "skip=assets/js/token.js" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage the upload package
        run: npm run build && node tools/build-dist.mjs

      - name: Stamp the build
        # Shipped as deployed.txt. The site carries no version marker anywhere
        # else, so without this the only way to tell which commit is live is to
        # read the markup and infer — which is exactly how a stale deploy hides
        # for two days.
        run: |
          {
            echo "commit: $GITHUB_SHA"
            echo "branch: $GITHUB_REF_NAME"
            echo "run:    $GITHUB_RUN_NUMBER"
            echo "built:  $(date -u '+%Y-%m-%d %H:%M:%SZ')"
          } > dist/deployed.txt
          cat dist/deployed.txt

      - name: Check the FTP secrets are present
        id: guard
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "FTP_SERVER is not set — skipping the upload."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # Shared hosting drops the FTP control connection while a long data
      # transfer is in progress, which surfaces as "Timeout (control socket)".
      # It only bites on large uploads, so it looks intermittent: small deploys
      # finish inside the window, big ones do not. Three things address it —
      # a longer timeout, FTPS (which also stops the password crossing the
      # network in clear text), and one retry, since a dropped socket is
      # transient by nature.
      - name: Upload changed files
        id: upload
        if: steps.guard.outputs.ready == 'true'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR }}
          local-dir: ./dist/
          protocol: ftps
          # 'loose' accepts the host's certificate without verifying it. The
          # credentials and payload are still encrypted, which plain FTP does
          # not manage at all; set this to 'strict' if SiteGround's FTP
          # certificate matches the hostname.
          security: loose
          timeout: 120000
          # Only transfers what actually changed, tracked by a manifest the
          # action leaves on the server.
          dangerous-clean-slate: ${{ inputs.clean_slate == true }}
          exclude: |
            **/.git*
            **/.git*/**
            **/american-byways-maps.zip
            ${{ steps.token.outputs.skip }}

      # A first attempt that died mid-transfer leaves no state file, so this
      # retry re-sends everything rather than resuming — slower, but it is the
      # difference between a deploy that lands and one that does not.
      - name: Retry the upload once
        id: retry
        if: steps.guard.outputs.ready == 'true' && steps.upload.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR }}
          local-dir: ./dist/
          protocol: ftps
          security: loose
          timeout: 180000
          dangerous-clean-slate: ${{ inputs.clean_slate == true }}
          exclude: |
            **/.git*
            **/.git*/**
            **/american-byways-maps.zip
            ${{ steps.token.outputs.skip }}

      - name: Report the upload result
        if: steps.guard.outputs.ready == 'true'
        run: |
          if [ "${{ steps.upload.outcome }}" = "success" ]; then
            echo "Uploaded on the first attempt."
          elif [ "${{ steps.retry.outcome }}" = "success" ]; then
            echo "The first attempt failed and the retry succeeded."
            echo "If this keeps happening, the host is dropping the control socket mid-transfer."
          else
            echo "Both upload attempts failed." >&2
            exit 1
          fi
