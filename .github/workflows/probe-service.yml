name: Probe a data service

# Asks a feature service what values a field actually takes.
#
# Every queried layer in config.js filters or colours on some field, and the
# values behind those filters have repeatedly been written from documentation
# or from memory rather than measured. A filter naming a value the service has
# never heard of matches nothing and draws an empty layer, which looks exactly
# like ground with nothing on it.
#
# The same job `check-archive` does for the tiles, for the other half of the
# map. Needs the network, so it runs here.

on:
  workflow_dispatch:
    inputs:
      url:
        description: >-
          The service query endpoint — e.g.
          https://services6.arcgis.com/ssFJjBXIUyZDrSYZ/arcgis/rest/services/Special_Use_Airspace/FeatureServer/0/query
        required: true
        type: string
      fields:
        description: 'Field names, comma or space separated — e.g. TYPE_CODE,LOCAL_TYPE. Ignored when counting.'
        required: false
        type: string
      count:
        description: >-
          Count features matching this WHERE instead of listing values — e.g.
          TYPE_CODE <> 'MOA'. Use 1=1 for everything.
        required: false
        type: string
      bbox:
        description: >-
          Limit the count to an envelope, minlon,minlat,maxlon,maxlat. Only
          used with `count`. This is how you ask what one view would receive.
        required: false
        type: string

permissions:
  contents: read

jobs:
  probe:
    name: Ask the service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No install: the probe is a fetch and some counting, which is the point
      # of this repo having no runtime dependencies.
      - name: Ask it
        run: |
          set -o pipefail
          if [ -n "${{ inputs.count }}" ]; then
            if [ -n "${{ inputs.bbox }}" ]; then
              node tools/probe-service.mjs "${{ inputs.url }}" \
                --count "${{ inputs.count }}" --bbox "${{ inputs.bbox }}" 2>&1 | tee report.txt
            else
              node tools/probe-service.mjs "${{ inputs.url }}" \
                --count "${{ inputs.count }}" 2>&1 | tee report.txt
            fi
          else
            FIELDS="$(printf '%s' "${{ inputs.fields }}" | tr ',' ' ')"
            # shellcheck disable=SC2086
            node tools/probe-service.mjs "${{ inputs.url }}" $FIELDS 2>&1 | tee report.txt
          fi

      - name: Put the answer in the summary
        if: always()
        run: |
          {
            echo "### ${{ inputs.fields }}"
            echo ""
            echo '```'
            cat report.txt || echo "nothing was written"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
