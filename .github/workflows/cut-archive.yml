name: Cut a map archive

# Hands back a .pmtiles file to put on a bucket.
#
# The deploy workflow can cut one and publish it with the site, which is the
# short way and is capped by the 1 GB Pages site. Past that the archive belongs
# on R2 or S3 — and getting one to upload otherwise means installing Go tooling
# and reading a hundred gigabytes of planet by byte range from a laptop.
#
# So this does the cutting here and leaves the result as a run artifact to
# download. It publishes nothing and touches no deployment.

on:
  workflow_dispatch:
    inputs:
      bbox:
        description: 'minlon,minlat,maxlon,maxlat — e.g. -89.6,34.9,-77.7,40.7 for the Appalachians'
        required: true
        type: string
      maxzoom:
        description: 'How deep. Each level is four times the one below; 13 shows every road this map draws, 15 is for house numbers.'
        required: false
        default: '13'
        type: string
      planet:
        description: 'Which planet build to cut from. Left empty, the most recent one that answers is used.'
        required: false
        type: string
      upload:
        description: >-
          Push the result straight to R2 instead of handing back a download.
          Needed for anything continental: an Actions artifact tops out well
          below a national archive, and a browser download of several gigabytes
          followed by a browser upload of several gigabytes is a bad afternoon.
        required: false
        default: false
        type: boolean
      key:
        description: 'What to call it in the bucket.'
        required: false
        default: 'byways.pmtiles'
        type: string

permissions:
  contents: read

jobs:
  cut:
    name: Cut it
    runs-on: ubuntu-latest
    # A continental extract is read out of the planet by byte range, and that
    # is hours rather than minutes. The job cap is six; this stops short of it
    # so the summary still gets written.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Make room
        # A national archive is several gigabytes and the runner ships with a
        # lot of things this job will never use. Cheaper than finding out at
        # 90% of a three-hour cut.
        if: ${{ inputs.upload }}
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          echo "after:"; df -h / | tail -1

      - name: Cut the archive
        id: cut
        env:
          BBOX: ${{ inputs.bbox }}
          ZOOM: ${{ inputs.maxzoom }}
          PLANET: ${{ inputs.planet }}
          OUT: byways.pmtiles
          # Two ceilings, because the two destinations are nothing alike. Going
          # to an artifact the limit is what Actions will store and what a
          # person will wait to download; going to a bucket it is the runner's
          # own disk.
          LIMIT: ${{ inputs.upload && '20000000000' || '4000000000' }}
        run: sh tools/cut-archive.sh

      # ------------------------------------------------------------- to R2
      #
      # The AWS CLI rather than wrangler or the dashboard, and this is the one
      # thing about R2 worth writing down: a single PUT to R2 is capped at
      # 300 MB, which is what both of those do. Past that it has to be a
      # multipart upload, and `aws s3 cp` splits the file itself. It is already
      # on the runner, so there is nothing to install.
      - name: Put it in the bucket
        if: ${{ inputs.upload }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # Recent AWS CLI versions add a checksum header to every upload that
          # several S3-compatible stores reject. Asking for it only where the
          # protocol requires it keeps this working across both.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          ACCOUNT: ${{ secrets.R2_ACCOUNT_ID }}
          BUCKET: ${{ vars.R2_BUCKET }}
          KEY: ${{ inputs.key }}
        run: |
          set -euo pipefail
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY ACCOUNT BUCKET; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not set. See docs/protomaps.md — the three R2 values are Secrets, the bucket name is a Variable."
              exit 1
            fi
          done
          aws s3 cp byways.pmtiles "s3://${BUCKET}/${KEY}" \
            --endpoint-url "https://${ACCOUNT}.r2.cloudflarestorage.com" \
            --content-type application/octet-stream \
            --no-progress
          echo "Uploaded $(wc -c < byways.pmtiles | tr -d ' ') bytes to ${BUCKET}/${KEY}"

      # And then ask the bucket whether a browser can actually read it, which
      # is the step that has caught every hosting problem this project has had.
      # Skipped rather than guessed at when no public URL is configured.
      - name: Ask the bucket whether a browser can read it
        if: ${{ inputs.upload && vars.R2_PUBLIC_BASE != '' }}
        continue-on-error: true
        env:
          BASE: ${{ vars.R2_PUBLIC_BASE }}
          KEY: ${{ inputs.key }}
        run: |
          set -o pipefail
          node tools/check-archive.mjs "${BASE%/}/${KEY}" 2>&1 | tee -a bucket.txt
          {
            echo "### The bucket, asked"
            echo ""
            echo '```'
            cat bucket.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        # Only when it is not going to the bucket. A national archive is
        # several gigabytes; uploading that to Actions so it can be downloaded
        # and uploaded again is the long way round the thing this workflow
        # exists to avoid.
        if: ${{ !inputs.upload }}
        with:
          name: byways-pmtiles
          path: byways.pmtiles
          # Long enough to notice the run and download it, short enough that a
          # few hundred megabytes are not kept around for a month.
          retention-days: 7
          compression-level: 0

      - name: What to do with it
        if: always()
        env:
          BYTES: ${{ steps.cut.outputs.bytes }}
          DEPTH: ${{ steps.cut.outputs.maxzoom }}
          UPLOADED: ${{ inputs.upload }}
          BASE: ${{ vars.R2_PUBLIC_BASE }}
          KEY: ${{ inputs.key }}
        run: |
          if [ -z "${BYTES:-}" ]; then
            echo "### byways.pmtiles" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Nothing was cut — see the *Cut the archive* step." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$UPLOADED" = "true" ]; then
            {
              echo "### byways.pmtiles — in the bucket"
              echo ""
              echo "\`${{ inputs.bbox }}\` to zoom ${DEPTH} — $((BYTES / 1024 / 1024)) MB, cut from \`${{ steps.cut.outputs.planet }}\`."
              echo ""
              echo "Uploaded as \`${KEY}\`. Two repository **Variables** left to set:"
              echo ""
              if [ -n "$BASE" ]; then
                echo "- \`PROTOMAPS_ARCHIVE\` = \`${BASE%/}/${KEY}\`"
              else
                echo "- \`PROTOMAPS_ARCHIVE\` = your bucket's public URL plus \`/${KEY}\`"
              fi
              echo "- \`PROTOMAPS_MAXZOOM\` = \`${DEPTH}\`"
              echo ""
              echo "Setting \`PROTOMAPS_ARCHIVE\` also stops the deploy cutting and publishing"
              echo "its own copy with the site, so the next deploy gets smaller as well."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### byways.pmtiles"
            echo ""
            echo "\`${{ inputs.bbox }}\` to zoom ${DEPTH} — $((BYTES / 1024 / 1024)) MB, cut from \`${{ steps.cut.outputs.planet }}\`."
            echo ""
            echo "Download it from **Artifacts** at the bottom of this run, then:"
            echo ""
            if [ "$BYTES" -gt 300000000 ]; then
              echo "1. **At $((BYTES / 1024 / 1024)) MB this is past R2's 300 MB single-part upload limit**,"
              echo "   so neither the dashboard nor \`wrangler r2 object put\` will take it — both"
              echo "   do one PUT. It needs a multipart upload, which means rclone or the aws"
              echo "   CLI against R2's S3 endpoint, and an R2 API token to go with them."
              echo ""
              echo "   Two easier ways: re-run this one zoom level shallower, which is a quarter"
              echo "   the size — or skip the bucket entirely and let the deploy publish it with"
              echo "   the site, which handles anything up to about 900 MB with no upload at all."
              echo "   See \`docs/protomaps.md\`."
            else
              echo "1. Upload it to your bucket. At $((BYTES / 1024 / 1024)) MB it is inside the"
              echo "   300 MB ceiling on Cloudflare's dashboard uploader, so dragging it in works."
            fi
            echo "2. \`npm run check:archive -- https://<bucket>/byways.pmtiles\` — it asks the host"
            echo "   whether it honours Range and sends CORS, and reads a real tile back."
            echo "3. Set the repository variables \`PROTOMAPS_ARCHIVE\` to that URL and"
            echo "   \`PROTOMAPS_MAXZOOM\` to \`${DEPTH}\`."
            echo ""
            echo "\`PROTOMAPS_ARCHIVE\` wins over the extract the deploy cuts, so setting it"
            echo "also stops the site carrying its own copy."
            echo ""
            echo "See \`docs/protomaps.md\` for the bucket and CORS settings."
          } >> "$GITHUB_STEP_SUMMARY"
