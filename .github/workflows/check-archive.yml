name: Check a map archive

# Asks a hosted .pmtiles file whether a browser can actually read it.
#
# Three things have to be true of whatever serves one, and a host that fails
# any of them produces a blank map rather than an error: Range requests, CORS,
# and gzip rather than brotli or zstd. None of that is visible from looking at
# the file, and all three are cheap to ask about.
#
# The same check runs locally as `npm run check:archive -- <url>`. It is here
# so that setting up a bucket needs nothing installed: paste the URL, read the
# answer.

on:
  workflow_dispatch:
    inputs:
      url:
        description: >-
          The .pmtiles URL — e.g. https://pub-xxxx.r2.dev/byways.pmtiles. Leave
          empty to check the archive this site is actually configured to use,
          from the PROTOMAPS_ARCHIVE repository variable.
        required: false
        type: string
      tile:
        description: >-
          Also read this tile and say what is in it, as z/x/y. Answers the
          question a wrong-looking map raises: the bytes arrived, so what do
          they contain? 13/2195/3225 is Gatlinburg.
        required: false
        type: string

permissions:
  contents: read

jobs:
  check:
    name: Ask the host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No install: the checker is written against the reader in this repo and
      # that has no dependencies, which is the point of having written it out.
      # Falls back to the configured archive, so checking your own bucket does
      # not require pasting your own URL back at yourself - and so a run can
      # ask about the file the site is really serving rather than one somebody
      # typed from memory.
      - name: Which archive
        id: which
        env:
          CONFIGURED: ${{ vars.PROTOMAPS_ARCHIVE }}
        run: |
          URL="${{ inputs.url }}"
          [ -n "$URL" ] || URL="$CONFIGURED"
          if [ -z "$URL" ]; then
            echo "No url given and PROTOMAPS_ARCHIVE is not set." >&2
            exit 2
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Check it
        id: check
        run: |
          set -o pipefail
          node tools/check-archive.mjs "${{ steps.which.outputs.url }}" 2>&1 | tee report.txt

      - name: Look inside a tile
        # Always, not only when the host check passed. They answer different
        # questions - "can a browser read this file" and "what is in it" - and
        # a run that asked both and reported one is a wasted trip. The first
        # time this mattered, the host check tripped over its own bug and took
        # the tile reading down with it.
        if: ${{ always() && inputs.tile != '' }}
        run: node tools/inspect-archive.mjs "${{ steps.which.outputs.url }}" "${{ inputs.tile }}" 2>&1 | tee -a report.txt

      - name: Put the answer in the summary
        if: always()
        run: |
          {
            echo "### ${{ inputs.url }}"
            echo ""
            echo '```'
            cat report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
