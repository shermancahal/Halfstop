<!-- Halfstop — Reauthentication -->
<!-- Paste into Supabase: Authentication → Emails → Templates. -->
<!-- A code rather than a link: this one confirms it is still you before
     something irreversible, so it must not be openable from an inbox alone. -->
<div style="margin:0;padding:24px 12px;background:#faf7f2;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <div style="max-width:520px;margin:0 auto;background:#ffffff;border:1px solid #e7e0d6;border-radius:10px;overflow:hidden;">
    <div style="background:#1f2846;padding:16px 24px;">
      <span style="color:#f2ece3;font-size:15px;font-weight:600;letter-spacing:.02em;">Halfstop</span>
    </div>
    <div style="padding:26px 24px;">
      <h1 style="margin:0 0 14px;font-size:19px;line-height:1.3;color:#1c1815;font-weight:600;">Confirm it is you</h1>
      <p style="margin:0 0 12px;font-size:15px;line-height:1.62;color:#3f3934;">Enter this code in Halfstop to continue:</p>
      <p style="margin:18px 0;font-size:30px;letter-spacing:.14em;font-weight:700;color:#1f2846;">{{ .Token }}</p>
      <p style="margin:0;font-size:13px;line-height:1.6;color:#6b625a;border-top:1px solid #e7e0d6;padding-top:16px;">
        If you did not ask for this code, ignore it and tell us at support@halfstop.app.
      </p>
    </div>
  </div>
</div>
