# Deploy settings the CLI reads, so they are not a flag somebody has to
# remember on the day they redeploy.
project_id = "gqemcvuushtfbbbxypvf"

# Resend has no session and never will, so this one authorises its own
# caller with a shared secret and must be reachable without a JWT. Deployed
# with the gateway check on, Supabase returns 401 before the function runs,
# and the symptom is a webhook that fails with nothing in the function log.
[functions.support-inbound]
verify_jwt = false

# The other two are called by a signed-in person, and read the user id from
# the verified token rather than from the request body. The gateway check
# stays on.
[functions.delete-account]
verify_jwt = true

[functions.invite-to-folder]
verify_jwt = true

# Stripe has no session either, so the webhook authorises its own caller with
# the signature on the request. Everything protecting it is in
# stripe-webhook/signature.mjs, which is plain JavaScript and unit tested.
[functions.stripe-webhook]
verify_jwt = false

# The checkout is started by a signed-in person, and who is paying is read from
# their token rather than from the request body.
[functions.stripe-checkout]
verify_jwt = true

# And the way out, which opens Stripe's billing portal for whoever is signed
# in. Which customer it opens is read from their token: a body naming one would
# be a body somebody else can write, and the portal can cancel a subscription.
[functions.stripe-portal]
verify_jwt = true
